services:
  self-hosted-runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Change this one value when you want a different shared runner label.
      RUNNER_LABEL: "${RUNNER_LABEL:-luke}"
      BASE_URL: "${BASE_URL:-https://opensource-demo.orangehrmlive.com}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-Admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    stdin_open: true
    tty: true
    volumes:
      # Anonymous volume: every scaled container gets its own agent config.
      - /runner
