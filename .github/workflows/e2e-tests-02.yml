name: Nightly E2E Send Notification Tests

on:
  push:
    branches: [ main, master,luke-tst ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 2 * * *' # Tránh phút 00 để giảm delay cron
  workflow_dispatch:

jobs:
  e2e-matrix:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run WebdriverIO Tests
        run: npx wdio run wdio.conf.js --browser ${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Error Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

  notify-team-channel:
    name: Send Detailed Slack Notification
    if: always()
    needs: e2e-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: combined-allure-results
          merge-multiple: true
        continue-on-error: true

      - name: Parse Allure Results & Send Slack Message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          # 1. Đếm số lượng Test Cases từ các file *-result.json
          PASSED=0
          FAILED=0
          BROKEN=0
          SKIPPED=0
          TOTAL=0

          if [ -d "combined-allure-results" ]; then
            for file in combined-allure-results/*-result.json; do
              if [ -f "$file" ]; then
                STATUS=$(node -e "try { console.log(require('./$file').status); } catch(e) { console.log(''); }")
                case "$STATUS" in
                  "passed") PASSED=$((PASSED + 1)) ;;
                  "failed") FAILED=$((FAILED + 1)) ;;
                  "broken") BROKEN=$((BROKEN + 1)) ;;
                  "skipped") SKIPPED=$((SKIPPED + 1)) ;;
                esac
              fi
            done
          fi

          TOTAL=$((PASSED + FAILED + BROKEN + SKIPPED))

          # 2. Định dạng màu sắc và icon tiêu đề
          OVERALL_STATUS="${{ needs.e2e-matrix.result }}"
          if [ "$OVERALL_STATUS" = "success" ]; then
            COLOR="#36a64f" # Xanh lá
            ICON="🟢"
            TITLE="E2E Test Suite Passed"
          else
            COLOR="#e01e5a" # Đỏ
            ICON="🔴"
            TITLE="E2E Test Suite Failed"
          fi

          # 3. Gửi payload đẹp mắt dạng Slack Block Kit
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{
              \"attachments\": [
                {
                  \"color\": \"$COLOR\",
                  \"blocks\": [
                    {
                      \"type\": \"header\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"$ICON $TITLE\",
                        \"emoji\": true
                      }
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Repository:*\n\`${{ github.repository }}\`\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Branch:*\n\`${{ github.ref_name }}\`\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Total Tests:* $TOTAL\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*✅ Passed:* $PASSED\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*❌ Failed:* $FAILED\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*⚠️ Broken/Skipped:* $((BROKEN + SKIPPED))\" }
                      ]
                    },
                    {
                      \"type\": \"actions\",
                      \"elements\": [
                        {
                          \"type\": \"button\",
                          \"text\": { \"type\": \"plain_text\", \"text\": \"View Workflow Run 🔍\" },
                          \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                        }
                      ]
                    }
                  ]
                }
              ]
            }" \
            "$SLACK_WEBHOOK_URL"